name: rag-case

# Shared by every application service. Values that differ between "in the
# browser" and "inside the compose network" are set explicitly here rather than
# inherited from .env, because .env describes the host-side setup.
x-app-env: &app-env
  # postgres:5432 is the in-network address; .env's localhost:5433 is the
  # host-side one.
  DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:?set VOYAGE_API_KEY in .env}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  # What the browser sees. Tokens are minted with this origin.
  BETTER_AUTH_URL: http://localhost:3000
  MCP_RESOURCE_URL: http://localhost:8787
  CORPUS_DIR: /app/data/corpus

services:
  postgres:
    # Fully pinned: pgvector 0.8.6 on PostgreSQL 18. The pgvector version
    # matters because the index operator classes come from the extension.
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: rag-case-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      # 5433 on the host: a native PostgreSQL install commonly owns 5432.
      - "5433:5432"
    volumes:
      # PostgreSQL 18+ images expect a single mount at /var/lib/postgresql and
      # place the cluster in a major-version subdirectory beneath it. Mounting
      # the older /var/lib/postgresql/data path makes the container refuse to
      # start.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Runs once, to completion, before the app services start. Applying the
  # schema from an app container's entrypoint instead would race: two replicas
  # would both try to migrate on boot.
  migrate:
    build:
      context: .
      target: node
    environment: *app-env
    command: sh -c "pnpm db:migrate && pnpm db:seed"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    container_name: rag-case-web
    restart: unless-stopped
    environment: *app-env
    ports:
      - "3000:3000"
    volumes:
      # Read-only: the app only reads the corpus. Mounted rather than baked in
      # so editing a file and re-indexing works without rebuilding the image.
      - ./data:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mcp:
    build:
      context: .
      target: node
    container_name: rag-case-mcp
    restart: unless-stopped
    environment:
      <<: *app-env
      # The MCP server verifies tokens against BETTER_AUTH_URL (what the token
      # says) but must fetch the JWKS over the compose network. Those are
      # genuinely different addresses.
      AUTH_INTERNAL_URL: http://web:3000
    ports:
      - "8787:8787"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Indexes the corpus. Runs alongside web rather than blocking it, so the app
  # is reachable immediately and a failed ingest shows up in the dashboard
  # instead of preventing startup.
  ingest:
    build:
      context: .
      target: node
    environment: *app-env
    command: ["pnpm", "ingest"]
    volumes:
      - ./data:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  pgdata:
