name: rag-case

services:
  postgres:
    # Fully pinned: pgvector 0.8.6 on PostgreSQL 18. Pinning the pgvector version
    # matters because index operator classes (hnsw / vector_cosine_ops) are
    # provided by the extension, not the server.
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: rag-case-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
      # Deterministic text search + collation, so ts_rank_cd and ORDER BY behave
      # identically on every reviewer's machine.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      # 5433 on the host: a native PostgreSQL install commonly already owns 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
